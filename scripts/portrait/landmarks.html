<!doctype html>
<html lang="nb">
<body style="background:#111;color:#eee;font-family:monospace;padding:1rem">
<p>Kjører MediaPipe Face Landmarker på <code>portrett.jpg</code> og skriver 478 punkter som JSON under. Server mappen med <code>node serve.mjs</code> og åpne <code>http://localhost:8123/landmarks.html</code>.</p>
<img id="img" src="../../public/portrett.jpg" style="max-width:320px;display:block" alt="">
<pre id="out">laster …</pre>
<script>
const out = document.getElementById('out')
;(async () => {
  try {
    const { FaceLandmarker, FilesetResolver } = await import('./node_modules/@mediapipe/tasks-vision/vision_bundle.mjs')
    const vision = await FilesetResolver.forVisionTasks('./node_modules/@mediapipe/tasks-vision/wasm')
    const landmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: './out/face_landmarker.task' },
      runningMode: 'IMAGE',
      numFaces: 1,
    })
    const img = document.getElementById('img')
    if (!img.complete) await new Promise((r) => (img.onload = r))
    const res = landmarker.detect(img)
    const points = res.faceLandmarks[0].map((p) => [+p.x.toFixed(5), +p.y.toFixed(5), +p.z.toFixed(5)])
    const json = { width: img.naturalWidth, height: img.naturalHeight, points }
    await fetch('/save/landmarks.json', { method: 'POST', body: JSON.stringify(json) })
    out.textContent = `ok: ${points.length} punkter lagret som out/landmarks.json`
  } catch (e) {
    out.textContent = 'feil: ' + e
  }
})()
</script>
</body>
</html>
